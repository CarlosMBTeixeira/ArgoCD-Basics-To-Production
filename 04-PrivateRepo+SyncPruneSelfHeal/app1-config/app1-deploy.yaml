apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: app1-ns
  labels:
    app: app1
spec:
  replicas: 5
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: app1
          image: cmbteixeira/argocd-varjosh-course-app1:v1.0.0
          ports:
            - containerPort: 5000
