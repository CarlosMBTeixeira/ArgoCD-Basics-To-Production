apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CarlosMBTeixeira/ArgoCD-Basics-To-Production.git
    path: 04-PrivateRepo+SyncPruneSelfHeal/app1-config   # or wherever your manifests actually live in your repo
    targetRevision: HEAD
    # repoURL: https://github.com/CloudWithVarJosh/cwvj-app1-config.git
    # targetRevision: HEAD
    # path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: app1-ns

    